[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-dependence-certificates"
version = "0.1.0"
description = "Finite tree coloring cylinder constraints with independently replayable exact infeasibility certificates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaiwen Jin", email = "yui.ui.siki@gmail.com"}]
dependencies = []

[project.optional-dependencies]
solver = ["numpy>=1.26", "scipy>=1.12"]
dev = ["pytest>=8", "build>=1.3", "ruff>=0.14", "numpy>=1.26", "scipy>=1.12", "sympy>=1.12"]

[project.urls]
Repository = "https://github.com/yuiyuiui/finite-dependence-certificates"
Documentation = "https://github.com/yuiyuiui/finite-dependence-certificates/tree/main/docs"
Issues = "https://github.com/yuiyuiui/finite-dependence-certificates/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
